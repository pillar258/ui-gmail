<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统仪表板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 2rem;
            min-height: 100vh;
        }
        
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .welcome-section {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        
        .welcome-title {
            font-size: 2rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }
        
        .welcome-subtitle {
            color: #64748b;
            font-size: 1.1rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: white;
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: transform 0.2s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
        }
        
        .stat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        
        .stat-title {
            font-size: 0.875rem;
            font-weight: 500;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .stat-icon {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: white;
        }
        
        .stat-icon.blue { background: #3b82f6; }
        .stat-icon.green { background: #10b981; }
        .stat-icon.yellow { background: #f59e0b; }
        .stat-icon.purple { background: #8b5cf6; }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.25rem;
        }
        
        .stat-change {
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .stat-change.positive {
            color: #10b981;
        }
        
        .stat-change.negative {
            color: #ef4444;
        }
        
        .charts-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .chart-card {
            background: white;
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        
        .chart-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 1rem;
        }
        
        .chart-placeholder {
            height: 200px;
            background: linear-gradient(45deg, #f1f5f9, #e2e8f0);
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 0.875rem;
        }
        
        .recent-activities {
            background: white;
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        
        .activity-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid #f1f5f9;
        }
        
        .activity-item:last-child {
            border-bottom: none;
        }
        
        .activity-icon {
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            background: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.75rem;
            flex-shrink: 0;
        }
        
        .activity-content {
            flex: 1;
        }
        
        .activity-title {
            font-size: 0.875rem;
            font-weight: 500;
            color: #1e293b;
            margin-bottom: 0.25rem;
        }
        
        .activity-time {
            font-size: 0.75rem;
            color: #64748b;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            .charts-section {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- 欢迎区域 -->
        <div class="welcome-section">
            <h1 class="welcome-title">欢迎回来，张水筑</h1>
            <p class="welcome-subtitle">今天是个美好的一天，让我们开始工作吧！</p>
        </div>
        
        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-title">总订单数</span>
                    <div class="stat-icon blue">📋</div>
                </div>
                <div class="stat-value">1,234</div>
                <div class="stat-change positive">+12.5% 较上月</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-title">生产完成率</span>
                    <div class="stat-icon green">✅</div>
                </div>
                <div class="stat-value">89.2%</div>
                <div class="stat-change positive">+3.1% 较上月</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-title">库存周转率</span>
                    <div class="stat-icon yellow">📦</div>
                </div>
                <div class="stat-value">4.7</div>
                <div class="stat-change negative">-0.3 较上月</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-title">质量合格率</span>
                    <div class="stat-icon purple">🎯</div>
                </div>
                <div class="stat-value">98.5%</div>
                <div class="stat-change positive">+0.8% 较上月</div>
            </div>
        </div>
        
        <!-- 图表区域 -->
        <div class="charts-section">
            <div class="chart-card">
                <h3 class="chart-title">生产趋势分析</h3>
                <div class="chart-placeholder">
                    📊 生产数据图表区域
                </div>
            </div>
            
            <div class="chart-card">
                <h3 class="chart-title">订单状态分布</h3>
                <div class="chart-placeholder">
                    🥧 订单状态饼图
                </div>
            </div>
        </div>
        
        <!-- 最近活动 -->
        <div class="recent-activities">
            <h3 class="chart-title">最近活动</h3>
            
            <div class="activity-item">
                <div class="activity-icon">📝</div>
                <div class="activity-content">
                    <div class="activity-title">新增生产订单 #PO-2024-001</div>
                    <div class="activity-time">2分钟前</div>
                </div>
            </div>
            
            <div class="activity-item">
                <div class="activity-icon">✅</div>
                <div class="activity-content">
                    <div class="activity-title">质检报告已完成</div>
                    <div class="activity-time">15分钟前</div>
                </div>
            </div>
            
            <div class="activity-item">
                <div class="activity-icon">📦</div>
                <div class="activity-content">
                    <div class="activity-title">原材料入库完成</div>
                    <div class="activity-time">1小时前</div>
                </div>
            </div>
            
            <div class="activity-item">
                <div class="activity-icon">👥</div>
                <div class="activity-content">
                    <div class="activity-title">新用户注册</div>
                    <div class="activity-time">2小时前</div>
                </div>
            </div>
            
            <div class="activity-item">
                <div class="activity-icon">🔧</div>
                <div class="activity-content">
                    <div class="activity-title">设备维护完成</div>
                    <div class="activity-time">3小时前</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
