<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List - jqGrid 5.8.10 功能展示</title>
   
    <!-- A link to a jQuery UI ThemeRoller theme, more than 22 built-in and many more custom -->
    <link rel="stylesheet" type="text/css" media="screen" href="css/jquery-ui.css" />
    <!-- A link to a jQuery multiselect css -->
    <link rel="stylesheet" type="text/css" media="screen" href="css/ui.multiselect.css" />

    <!-- A link to a jQuery UI ThemeRoller theme, more than 22 built-in and many more custom -->
    <link rel="stylesheet" type="text/css" media="screen" href="css/bootstrap.css" />
    <link rel="stylesheet" type="text/css" media="screen" href="css/uibootstrap/jquery-ui-1.10.0.bootstrap.css" />

    <!-- The link to the CSS that the grid needs -->
    <link rel="stylesheet" type="text/css" media="screen" href="css/trirand/ui.jqgrid.css" />
    <!-- <link rel="stylesheet" type="text/css" media="screen" href="css/trirand/ui.jqgrid-bootstarp.css" /> -->
  <!-- The jQuery library is a prerequisite for all jqSuite products -->
    <script type="text/ecmascript" src="js/jquery.min.js"></script>
    <!-- This is the Javascript file of jQuery UI -->
    <script type="text/ecmascript" src="js/jquery-ui.min.js"></script>
    <!-- This is the multiselect file. It should be loaded after jqueryui and befor the grid  -->
    <script type="text/ecmascript" src="js/ui.multiselect.js"></script>

    <!-- This is the Javascript file of jqGrid -->
    <script type="text/ecmascript" src="js/trirand/jquery.jqGrid.min.js"></script>
    <!-- This is the localization file of the grid controlling messages, labels, etc.
    <!-- We support more than 40 localizations -->
    <script type="text/ecmascript" src="js/trirand/i18n/grid.locale-en.min.js"></script>
    <style>
         /* 隐藏顶部分页器中的分页元素，只保留功能按钮 */
        .ui-jqgrid .ui-jqgrid-toppager .ui-paging-pager,
        .ui-jqgrid .ui-jqgrid-toppager .ui-paging-info{
            display: none !important;
        }
    </style>

</head>

<body>

    <div class="container-fluid">
        <h1 class="text-center mb-4">jqGrid 5.8.10 功能展示</h1>
        <p class="text-center text-muted mb-5">展示最新版本 jqGrid 的高级功能和特性</p>

        <!-- 基础表格功能 -->
        <div class="feature-demo">
            <div class="grid-container">
                <h3 class="demo-title"><i class="bi bi-table"></i> 基础表格功能</h3>
                <table id="grid1"></table>
                <div id="pager1"></div>
            </div>
        </div>

        <!-- 高级编辑功能 -->
        <div class="feature-demo">
            <div class="grid-container">
                <h3 class="demo-title"><i class="bi bi-pencil-square"></i> 行内编辑功能</h3>
                <table id="grid2"></table>
                <div id="pager2"></div>
            </div>
        </div>

        <!-- 分组功能 -->
        <div class="feature-demo">
            <div class="grid-container">
                <h3 class="demo-title"><i class="bi bi-collection"></i> 数据分组功能</h3>
                <table id="grid3"></table>
                <div id="pager3"></div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        $(document).ready(function () {
            console.log('jqGrid 5.8.10 初始化开始...');
            console.log('jQuery 版本:', $.fn.jquery);
            console.log('jqGrid 可用:', typeof $.fn.jqGrid !== 'undefined');

            // 示例数据
            var userData = [
                { id: "1", name: "张三", email: "zhangsan@example.com", department: "技术部", salary: 8000, active: true, joinDate: "2020-01-15" },
                { id: "2", name: "李四", email: "lisi@example.com", department: "技术部", salary: 9500, active: true, joinDate: "2019-03-20" },
                { id: "3", name: "王五", email: "wangwu@example.com", department: "市场部", salary: 7500, active: false, joinDate: "2021-06-10" },
                { id: "4", name: "赵六", email: "zhaoliu@example.com", department: "市场部", salary: 8200, active: true, joinDate: "2020-09-05" },
                { id: "5", name: "钱七", email: "qianqi@example.com", department: "人事部", salary: 7000, active: true, joinDate: "2022-01-12" },
                { id: "6", name: "孙八", email: "sunba@example.com", department: "人事部", salary: 7800, active: false, joinDate: "2021-11-30" },
                { id: "7", name: "周九", email: "zhoujiu@example.com", department: "财务部", salary: 8500, active: true, joinDate: "2020-04-18" },
                { id: "8", name: "吴十", email: "wushi@example.com", department: "财务部", salary: 9000, active: true, joinDate: "2019-08-25" }
            ];

            // 基础表格 - 展示搜索、排序、分页功能
            $("#grid1").jqGrid({
                data: userData,
                datatype: "local",
                colModel: [
                    { label: 'ID', name: 'id', key: true, width: 60, sorttype: 'int' },
                    { label: '姓名', name: 'name', width: 100, search: true },
                    { label: '邮箱', name: 'email', width: 180, search: true },
                    { label: '部门', name: 'department', width: 100, search: true },
                    { label: '薪资', name: 'salary', width: 80, formatter: 'currency', sorttype: 'number', search: true, searchoptions: { sopt: ['eq', 'ne', 'lt', 'le', 'gt', 'ge'] } },
                    {
                        label: '状态', name: 'active', width: 80, formatter: function (cellvalue) {
                            return cellvalue ? '<span class="badge bg-success">在职</span>' : '<span class="badge bg-secondary">离职</span>';
                        }
                    },
                    { label: '入职日期', name: 'joinDate', width: 100, formatter: 'date', formatoptions: { srcformat: 'Y-m-d', newformat: 'Y-m-d' } }
                ],
                pager: "#pager1",
                rowNum: 3,
                rowList: [3, 30, 50],
                viewrecords: true,
                caption: "员工信息管理 - 基础功能",
                height: 380,
                autowidth: true,
                shrinkToFit: true,
                rownumWidth: 30,
                rownumbers: true,
                multiselect: true,
                sortname: 'id',
                sortorder: 'asc',
                colMenu: true,
                toppager: true,
                loadComplete: function () {
                    console.log('Grid1 loaded successfully');
                }
            });

            // 添加导航栏（顶部 - 功能按钮）
            $("#grid1").jqGrid('navGrid', '#grid1_toppager', {
                edit: false, add: false, del: false, search: true, refresh: true
            });
            
            // 添加列选择器按钮
            $("#grid1").navButtonAdd('#grid1_toppager', {
                buttonicon: "ui-icon-calculator",
                title: "列选择器",
                caption: "列",
                position: "last",
                onClickButton: function () {
                    $("#grid1").jqGrid('columnChooser');
                }
            });

            // 添加导航栏（底部 - 仅分页）
            $("#grid1").jqGrid('navGrid', '#pager1', {
                edit: false, add: false, del: false, search: false, refresh: false
            });

            // 添加搜索工具栏（显示）
            $("#grid1").jqGrid('filterToolbar', {
                searchOnEnter: false,
                enableClear: true
            });

            // 行内编辑表格
            $("#grid2").jqGrid({
                data: JSON.parse(JSON.stringify(userData)), // 深拷贝数据
                datatype: "local",
                colModel: [
                    { label: 'ID', name: 'id', key: true, width: 60, editable: false },
                    { label: '姓名', name: 'name', width: 100, editable: true, editrules: { required: true } },
                    { label: '邮箱', name: 'email', width: 180, editable: true, editrules: { required: true, email: true } },
                    {
                        label: '部门', name: 'department', width: 100, editable: true, edittype: 'select',
                        editoptions: { value: '技术部:技术部;市场部:市场部;人事部:人事部;财务部:财务部' }
                    },
                    {
                        label: '薪资', name: 'salary', width: 80, editable: true, editrules: { number: true, minValue: 1000 },
                        formatter: 'currency', sorttype: 'number'
                    },
                    {
                        label: '状态', name: 'active', width: 80, editable: true, edittype: 'checkbox',
                        editoptions: { value: 'true:false' }, formatter: 'checkbox'
                    }
                ],
                pager: "#pager2",
                rowNum: 18,
                rowList: [18, 30, 50],
                viewrecords: true,
                caption: "员工信息管理 - 行内编辑",
                height: 380,
                autowidth: true,
                shrinkToFit: true,
                rownumWidth: 30,
                rownumbers: true,
                sortname: 'id',
                sortorder: 'asc',
                cellEdit: true,
                cellsubmit: 'clientArray',
                toppager: true,
                loadComplete: function () {
                    console.log('Grid2 loaded successfully');
                }
            });

            // 添加导航栏（顶部 - 功能按钮）
            $("#grid2").jqGrid('navGrid', '#grid2_toppager', {
                edit: true, add: true, del: true, search: true, refresh: true
            });
            
            // 添加列选择器按钮
            $("#grid2").navButtonAdd('#grid2_toppager', {
                buttonicon: "ui-icon-calculator",
                title: "列选择器",
                caption: "列",
                position: "last",
                onClickButton: function () {
                    $("#grid2").jqGrid('columnChooser');
                }
            });

            // 添加导航栏（底部 - 仅分页）
            $("#grid2").jqGrid('navGrid', '#pager2', {
                edit: false, add: false, del: false, search: false, refresh: false
            });

            // 添加搜索工具栏（显示）
            $("#grid2").jqGrid('filterToolbar', {
                searchOnEnter: false,
                enableClear: true
            });

            // 分组表格
            $("#grid3").jqGrid({
                data: JSON.parse(JSON.stringify(userData)), // 深拷贝数据
                datatype: "local",
                colModel: [
                    { label: 'ID', name: 'id', key: true, width: 60, sorttype: 'int', search: true },
                    { label: '姓名', name: 'name', width: 100, search: true },
                    { label: '邮箱', name: 'email', width: 180, search: true },
                    { label: '部门', name: 'department', width: 100, search: true },
                    { label: '薪资', name: 'salary', width: 80, formatter: 'currency', sorttype: 'number', summaryType: 'avg', search: true, searchoptions: { sopt: ['eq', 'ne', 'lt', 'le', 'gt', 'ge'] } },
                    {
                        label: '状态', name: 'active', width: 80, formatter: function (cellvalue) {
                            return cellvalue ? '<span class="badge bg-success">在职</span>' : '<span class="badge bg-secondary">离职</span>';
                        }, search: true
                    }
                ],
                pager: "#pager3",
                rowNum: 20,
                rowList: [20, 30, 50],
                viewrecords: true,
                caption: "员工信息管理 - 按部门分组",
                height: 420,
                autowidth: true,
                shrinkToFit: true,
                rownumWidth: 30,
                rownumbers: true,
                grouping: true,
                groupingView: {
                    groupField: ['department'],
                    groupColumnShow: [false],
                    groupText: ['<b>部门: {0}</b> ({1} 人)'],
                    groupCollapse: false,
                    groupOrder: ['asc'],
                    groupSummary: [true],
                    groupDataSorted: true
                },
                sortname: 'department',
                sortorder: 'asc',
                toppager: true,
                loadComplete: function () {
                    console.log('Grid3 loaded successfully');
                }
            });

            // 添加导航栏（顶部 - 功能按钮）
            $("#grid3").jqGrid('navGrid', '#grid3_toppager', {
                edit: false, add: false, del: false, search: true, refresh: true
            });
            
            // 添加列选择器按钮
            $("#grid3").navButtonAdd('#grid3_toppager', {
                buttonicon: "ui-icon-calculator",
                title: "列选择器",
                caption: "列",
                position: "last",
                onClickButton: function () {
                    $("#grid3").jqGrid('columnChooser');
                }
            });

            // 添加导航栏（底部 - 仅分页）
            $("#grid3").jqGrid('navGrid', '#pager3', {
                edit: false, add: false, del: false, search: false, refresh: false
            });

            // 添加搜索工具栏（显示）
            $("#grid3").jqGrid('filterToolbar', {
                searchOnEnter: false,
                enableClear: true
            });

            console.log('jqGrid 5.8.10 初始化完成!');

            // 自适应宽度：窗口变化时重设每个表格宽度
            function resizeGrids() {
                $("#grid1").jqGrid('setGridWidth', $("#grid1").closest('.grid-container').width());
                $("#grid2").jqGrid('setGridWidth', $("#grid2").closest('.grid-container').width());
                $("#grid3").jqGrid('setGridWidth', $("#grid3").closest('.grid-container').width());
            }
            resizeGrids();
            $(window).on('resize', function () {
                clearTimeout(window.__jqResizeTimer);
                window.__jqResizeTimer = setTimeout(resizeGrids, 150);
            });
        });
    </script>

</body>

</html>
