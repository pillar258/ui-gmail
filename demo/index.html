<!DOCTYPE html>

<html lang="en">
<head>
    <!-- The jQuery library is a prerequisite for all jqSuite products -->
    <script type="text/ecmascript" src="../demo/js/jquery.min.js"></script> 
    <!-- We support more than 40 localizations -->
    <script type="text/ecmascript" src="../demo/js/trirand/i18n/grid.locale-cn.js"></script>
    <!-- This is the Javascript file of jqGrid -->   
    <script type="text/ecmascript" src="../demo/js/trirand/jquery.jqGrid.js"></script>

   <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.2/css/bootstrap.min.css" integrity="sha384-PsH8R72JQ3SOdhVi3uxftmaW6Vc51MKb0q5P2rRUpPvrszuE4W1povHYgTpBfshb" crossorigin="anonymous">	
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/octicons/4.4.0/font/octicons.css">
    <!-- The link to the CSS that the grid needs -->
    <link rel="stylesheet" type="text/css" media="screen" href="../demo/css/trirand/ui.jqgrid-bootstrap4.css" />
    <!-- 自定义样式覆盖 -->
    <link rel="stylesheet" type="text/css" media="screen" href="../ui.jqgrid.override.css" />
	<script>
		$.jgrid.defaults.width = 780;
		$.jgrid.defaults.responsive = true;
		$.jgrid.defaults.styleUI = 'Bootstrap4';
		$.jgrid.defaults.iconSet = "Octicons";
	</script>
    

    <meta charset="utf-8" />
    <title>jqGrid Loading Data - Custom Toolbar Button</title>
</head>
<body>
<div style="margin-left:20px">
    <table id="jqGrid"></table>
    <div id="jqGridPager"></div>
</div>
    <script type="text/javascript"> 
    
        $(document).ready(function () {
            $("#jqGrid").jqGrid({
                url: 'data.json',
                datatype: "json",
                		// styleUI : 'Bootstrap4',
               colModel: [
                    { label: 'OrderID', name: 'OrderID', key: true, width: 75 },
                    { label: 'Customer ID', name: 'CustomerID', width: 150 },
                    { label: 'Order Date', name: 'OrderDate', width: 150 },
                    { label: 'Freight', name: 'Freight', width: 150 },
                    { label:'Ship Name', name: 'ShipName', width: 150 }
                ],
				loadonce: true,
				viewrecords: true,
                colMenu:true,
                height: 200,
                rowNum: 15,
                pager: "#jqGridPager"
            });

            // We need to have a navigation bar in order to add custom buttons to it
            $('#jqGrid').navGrid('#jqGridPager',
                { edit: false, add: false, del: false, search: true, refresh: true, view: false, position: "left", cloneToTop: true });

            // add first custom button
            $('#jqGrid').navButtonAdd('#jqGridPager',
                {
                    buttonicon: "ui-icon-mail-closed",
                    title: "Send Mail",
                    caption: "Send Mail",
                    position: "last",
                    onClickButton: customButtonClicked
                });


           /// add second custom button
           $('#jqGrid').navButtonAdd('#jqGridPager',
                {
                    buttonicon: "ui-icon-pencil",
                    title: "Edit",
                    caption: "Edit",
                    position: "last",
                    onClickButton: customButtonClicked
                });
        });

        function customButtonClicked() {
            alert("You have clicked a custom button.");
        }

    </script>
 
</body>
</html>
